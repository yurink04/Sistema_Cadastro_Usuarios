<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Cadastros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sistema de Cadastros</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="usuarios.html">Usuários</a>
            <a href="cadastro.html" class="active">Cadastro</a>
        </nav>
    </header>
    <main class="tela-cadastro">
        <h1>Cadastro de Usuários</h1>
        <div><form id="form-cadastro">
            <input type="text" class="entrada" placeholder="Nome" id="nome" name="nome" required>
            <input type="email" class="entrada" placeholder="E-mail" id="email" name="email" required>
            <input type="password" class="entrada senha" placeholder="Senha" id="senha" name="senha" required>
            <span id="feedbackSenha" class="feedback"></span>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
    </main>
    <footer class="rodape">

    </footer>
    <script src="scripts.js"></script>
</body>
</html>
