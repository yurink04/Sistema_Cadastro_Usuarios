<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Cadastros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body_login">
    <div id="welcomeModal" class="modal">
        <div class="modal-content">
            <h2>Bem-vindo ao Sistema de Cadastro</h2>
            <p>Por favor, faça login para continuar.</p>
            <button id="closeModal">Fechar</button>
        </div>
    </div>
    <div class="tela-login">
        <h1>Login</h1>
        <form id="loginForm">
            <input type="text" placeholder="Usuário" class="entrada" id="usuario" required>
            <input type="password" placeholder="Senha" class="entrada" id="senha" required>
            <button type="submit">Entrar</button>
        </form>
        <div id="loadingIcon" class="loading">Carregando...</div>
        <div id="modalErro" class="modal">
            <div class="modal-content">
                <p>Usuário ou senha inválidos!</p>
                <button id="fecharErro">Fechar</button>
            </div>
        </div>
    </div>
    <footer class="rodape">
        Desenvolvido por Samuel Neves. <br>
        Contato: <a href="mailto:samuelventuri@outlook.com">samuelventuri@outlook.com</a>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
