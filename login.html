<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Cadastros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body_login">
    <div id="welcomeModal" class="modal-container">
        <div class="modal-content">
            <h2>Bem-vindo ao Sistema de Cadastro</h2>
            <p>Por favor, faça login para continuar.</p>
            <button id="closeModal">Fechar</button>
        </div>
    </div>
    <div class="tela-login">
        <h1>Login</h1>
        <form id="loginForm">
            <input type="text" placeholder="Usuário" class="entrada" id="usuario" required>
            <input type="password" placeholder="Senha" class="entrada" id="senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
