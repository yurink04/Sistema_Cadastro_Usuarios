<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Cadastro - Sistema de Cadastros</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body class="body_form">
    <header>
        <h1>Sistema de Cadastro</h1>
    </header>
    <div class="box">
        <form id="cadastroForm">
            <fieldset>
                <legend><b>Cadastro de Cliente</b></legend>
                <div class="inputbox">
                    <input type="text" name="nome" id="nome" class="inputuser" required>
                    <label for="nome" class="labelinput">Nome completo</label>
                </div>
                <div class="inputbox">
                    <input type="text" name="email" id="email" class="inputuser" required>
                    <label for="email" class="labelinput">E-mail</label>
                </div>
                <div class="inputbox">
                    <input type="tel" name="telefone" id="telefone" class="inputuser" required>
                    <label for="telefone" class="labelinput">Telefone</label>
                </div>
                <p>Sexo:</p>
                <div class="radio-group">
                    <input type="radio" id="feminino" name="genero" value="feminino" class="genero" required>
                    <label for="feminino" class="lgenero">Feminino</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="masculino" name="genero" value="masculino" class="genero" required>
                    <label for="masculino" class="lgenero">Masculino</label>
                </div>
                <div class="radio-group">
                    <input type="radio" id="outro" name="genero" value="outro" class="genero" required>
                    <label for="outro" class="lgenero">Outro</label>
                </div><br>
                <div>
                    <label for="data_nascimento"><b>Data de nascimento:</b></label>
                    <input type="date" name="data_nascimento" id="data_nascimento" required>
                </div><br>
                <div class="inputbox">
                    <input type="text" name="cidade" id="cidade" class="inputuser" required>
                    <label for="cidade" class="labelinput">Cidade</label>
                </div>
                <div class="inputbox">
                    <input type="text" name="estado" id="estado" class="inputuser" required>
                    <label for="estado" class="labelinput">Estado</label>
                </div>
                <div class="inputbox">
                    <input type="text" name="endereco" id="endereco" class="inputuser" required>
                    <label for="endereco" class="labelinput">Endereço</label>
                </div>
                <div class="button-group">
                    <button type="submit" id="submit">Enviar</button>
                    <button type="button" id="reset" class="icon-button" title="Limpar">
                        <img src="lixeira.png" alt="Limpar" class="icon">
                    </button>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
